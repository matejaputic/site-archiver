# Example workflow using the Site Archiver action
# Copy this to .forgejo/workflows/archive.yml in your repository

name: Archive Website

on:
  # Run daily at 3 AM UTC
  schedule:
    - cron: '0 3 * * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Option 1: Archive all URLs from sitemap
      - name: Archive website
        uses: your-org/site-archiver@v2
        with:
          sitemap_url: 'https://example.com/sitemap.xml'
          output_dir: 'pages'
          delay_ms: '1000'
          commit: 'true'
          commit_message: 'Archive website content {date}'

      # Option 2: Archive only blog posts (uncomment to use)
      # - name: Archive blog posts only
      #   uses: your-org/site-archiver@v2
      #   with:
      #     sitemap_url: 'https://example.com/sitemap.xml'
      #     xpath: "//url/loc[contains(text(), '/blog/')]"
      #     output_dir: 'blog-archive'

      # Option 3: Test XPath with dry-run (uncomment to use)
      # - name: Test XPath filter (dry run)
      #   uses: your-org/site-archiver@v2
      #   with:
      #     sitemap_url: 'https://example.com/sitemap.xml'
      #     xpath: "//url/loc[contains(text(), '/docs/')]"
      #     dry_run: 'true'
